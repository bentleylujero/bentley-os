
services:

  postgres:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bentley
      POSTGRES_USER: bentley
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1  -U bentley -d bentley"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"

  qdrant:
    image: qdrant/qdrant:v1.13.6
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    ports:
      - "127.0.0.1:6333:6333"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    ports:
      - "127.0.0.1:6379:6379"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O -  http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    ports:
      - "127.0.0.1:3000:3000"

  deploy:
    build:
      context: ./deploy
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      COMPOSE_PROJECT_NAME: bentley-os
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/home/spaghettios/bentley-os
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  opencode:
    build:
      context: ./opencode
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      COMPOSE_PROJECT_NAME: bentley-os
    volumes:
      - ./:/home/spaghettios/bentley-os
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s

  cloudflared:
    image: cloudflare/cloudflared:2025.5.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy

  portainer:
    image: portainer/portainer-ce:2.27.3
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - monitoring
    ports:
      - "127.0.0.1:9000:9000"

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - monitoring
    ports:
      - "127.0.0.1:8080:8080"

  uptime-kuma:
    image: louislam/uptime-kuma:1
    restart: unless-stopped
    volumes:
      - uptime_data:/app/data
    networks:
      - monitoring
    ports:
      - "127.0.0.1:3001:3001"

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  portainer_data:
  uptime_data:

networks:
  backend:
    driver: bridge
  monitoring:
    driver: bridge
